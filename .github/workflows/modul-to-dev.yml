name: Modul nach dev

# Übernimmt den Modulordner <id>/ aus dem Branch modul/<id> nach dev. Die modul/*-Branches enthalten
# nur ihren Modulordner (+ LICENSE/README); ein normaler Merge würde deshalb alles andere in dev
# löschen. Der Workflow kopiert stattdessen gezielt nur <id>/ und committet das auf dev.
# Anschließend geht es wie gewohnt per Pull Request dev -> main (dort laufen die PR checks).
#
# Starten: Actions -> "Modul nach dev" -> Run workflow (Branch dev, Standard "alle" -> einfach
# bestätigen). Für nur ein Modul die ID eintragen (z. B. rewe).
#
# Hinweis: Einen Push-Trigger auf modul/** gibt es bewusst nicht -- GitHub nimmt für einen Push die
# Workflow-Datei aus dem gepushten Branch, und die modul/*-Branches enthalten kein .github.
on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Modul-ID (z. B. rewe) oder "alle"'
        required: false
        default: 'alle'

permissions:
  contents: write

concurrency:
  group: modul-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Module nach dev übernehmen
        env:
          INPUT: ${{ inputs.module }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$INPUT" ] || [ "$INPUT" = "alle" ]; then
            ids=$(git for-each-ref --format='%(refname:strip=4)' 'refs/remotes/origin/modul/*')
          else
            ids="$INPUT"
          fi

          changed=0
          for id in $ids; do
            # Nur einfache Ordnernamen zulassen
            [[ "$id" =~ ^[a-z0-9_-]+$ ]] || { echo "Ungültige Modul-ID: $id"; exit 1; }
            git fetch -q origin "modul/$id"
            git ls-tree -d --name-only "origin/modul/$id" | grep -qx "$id" \
              || { echo "modul/$id enthält keinen Ordner $id/"; exit 1; }
            git rm -rq --ignore-unmatch -- "$id"
            git checkout "origin/modul/$id" -- "$id"
            if git diff --cached --quiet; then
              echo "$id: schon aktuell."
              continue
            fi
            git commit -q -m "$id: Stand von modul/$id übernehmen ($(git rev-parse --short "origin/modul/$id"))"
            echo "$id: übernommen."
            changed=1
          done

          if [ "$changed" = 1 ]; then git push origin HEAD:dev; fi
